name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compilar
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: cita-sescam-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK en Releases (para descargarla desde el movil)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-ultima --yes --cleanup-tag || true
          gh release create apk-ultima app/build/outputs/apk/debug/app-debug.apk \
            --title "APK ultima version" --notes "Ultima compilacion" --target "${{ github.sha }}"
